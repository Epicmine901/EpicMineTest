<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Javoblar - EpicMineTest</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Tashqi uslublar fayli -->
    <link rel="stylesheet" href="css/Javob.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <div>
        <header class="sticky top-0 z-50 glass-header border-b border-slate-200">
            <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
                
                <!-- Logo & Title -->
                <div class="flex items-center space-x-3 min-w-0">
                    <a href="index.html" class="flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-xl bg-slate-900 text-white shadow-sm">
                        <i class="fa-solid fa-layer-group text-lg"></i>
                    </a>
                    <div class="min-w-0">
                        <a href="index.html" class="glitch-logo text-base sm:text-xl leading-none block truncate">
                            EPICMINETEST
                        </a>
                        <p id="subjectTitle" class="text-xs font-semibold text-blue-600 truncate pt-0.5">Yuklanmoqda...</p>
                    </div>
                </div>

                <!-- Total Count Badge -->
                <div class="flex-shrink-0 flex items-center space-x-2 bg-slate-100 px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-700">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="hidden xs:inline">Jami:</span>
                    <strong id="total-count" class="text-slate-900 font-bold">0</strong>
                </div>

            </div>
        </header>

        <main class="max-w-4xl mx-auto px-4 py-6">
            
            <!-- Controls Toolbar -->
            <div class="mb-6 space-y-3">
                <div class="flex flex-row gap-2">
                    
                    <!-- Search Input -->
                    <div class="relative flex-grow">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input 
                            type="text" 
                            id="search-input" 
                            placeholder="Savol yoki javobdan izlash..." 
                            class="w-full pl-10 pr-9 py-2.5 bg-white border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-800 focus:outline-none focus:border-blue-500 shadow-sm"
                        >
                        <button id="clear-search" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1">
                            <i class="fa-solid fa-xmark text-sm"></i>
                        </button>
                    </div>

                    <!-- View Toggle Buttons -->
                    <div class="flex bg-white border border-slate-200 rounded-xl p-1 shadow-sm shrink-0">
                        <button id="view-card" class="px-3 py-1.5 rounded-lg text-xs font-bold text-blue-600 bg-blue-50 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-border-all"></i>
                            <span class="hidden sm:inline">Kartochka</span>
                        </button>
                        <button id="view-compact" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-800 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-list-ul"></i>
                            <span class="hidden sm:inline">Ixcham</span>
                        </button>
                    </div>

                    <!-- Settings Button -->
                    <button id="open-settings-btn" class="w-10 h-10 bg-white border border-slate-200 rounded-xl flex items-center justify-center text-slate-600 hover:text-blue-600 hover:bg-slate-50 transition shadow-sm shrink-0" title="Sozlamalar">
                        <i class="fa-solid fa-gear text-base"></i>
                    </button>

                </div>

                <div id="search-status" class="hidden text-xs font-medium text-slate-500 px-1">
                    Qidiruv bo'yicha topildi: <strong id="visible-count" class="text-blue-600">0</strong> ta savol
                </div>
            </div>

            <!-- Dynamic Questions Container -->
            <div id="questions-container">
                <!-- Savollar dinamik ravishda chiqariladi -->
            </div>

            <!-- Empty state -->
            <div id="no-results" class="hidden text-center py-12 px-4 bg-white rounded-2xl border border-slate-200 mt-4">
                <i class="fa-solid fa-magnifying-glass text-2xl text-slate-300 mb-2"></i>
                <h4 class="text-sm font-bold text-slate-700">Hech narsa topilmadi</h4>
            </div>

        </main>
    </div>

    <!-- Settings Modal Panel -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl border border-slate-100">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-blue-600"></i>
                    Matn Sozlamalari
                </h3>
                <button id="close-settings-btn" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-lg flex items-center justify-center hover:bg-slate-100">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-4 text-xs">
                <!-- Shrift Tanlash -->
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Shrift (Font Family)</label>
                    <select id="font-family-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-800 font-medium focus:outline-none focus:border-blue-500">
                        <option value="'Inter', sans-serif">Inter (Default)</option>
                        <option value="'Montserrat', sans-serif">Montserrat</option>
                        <option value="'Roboto', sans-serif">Roboto</option>
                        <option value="Arial, sans-serif">Arial</option>
                        <option value="'Times New Roman', serif">Times New Roman</option>
                    </select>
                </div>

                <!-- Font Size Slider -->
                <div>
                    <div class="flex justify-between font-semibold text-slate-700 mb-1">
                        <span>Text o'lchami (Size)</span>
                        <span id="font-size-val" class="text-blue-600">16px</span>
                    </div>
                    <input type="range" id="font-size-range" min="12" max="24" value="16" class="w-full accent-blue-600 cursor-pointer">
                </div>

                <!-- Savol Color & Bold -->
                <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 space-y-2">
                    <span class="font-semibold text-slate-700 block">Savol stili</span>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <input type="color" id="savol-color-picker" value="#1e293b" class="w-8 h-8 rounded border-none cursor-pointer bg-transparent">
                            <span class="text-slate-600">Rangini tanlash</span>
                        </div>
                        <button id="savol-bold-btn" class="w-8 h-8 border border-slate-300 rounded-lg font-bold text-sm bg-white hover:bg-slate-100 text-slate-800 flex items-center justify-center" title="Jirniy">
                            Ж
                        </button>
                    </div>
                </div>

                <!-- Javob Color & Bold -->
                <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 space-y-2">
                    <span class="font-semibold text-slate-700 block">Javob stili</span>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <input type="color" id="javob-color-picker" value="#334155" class="w-8 h-8 rounded border-none cursor-pointer bg-transparent">
                            <span class="text-slate-600">Rangini tanlash</span>
                        </div>
                        <button id="javob-bold-btn" class="w-8 h-8 border border-slate-300 rounded-lg font-bold text-sm bg-white hover:bg-slate-100 text-slate-800 flex items-center justify-center" title="Jirniy">
                            Ж
                        </button>
                    </div>
                </div>

                <!-- Reset Button -->
                <button id="reset-settings-btn" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl transition">
                    Sozlamalarni tiklash (Reset)
                </button>
            </div>
        </div>
    </div>

    <footer class="mt-auto py-5 border-t border-slate-200 bg-white">
        <div class="max-w-4xl mx-auto px-4 text-center text-xs text-slate-400">
            &copy; <a href="index.html" class="font-bold text-slate-600 hover:text-blue-600">EpicMineTest</a>. Barcha huquqlar himoyalangan.
        </div>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-2xl shadow-xl z-50 flex items-center gap-2">
        <i class="fa-solid fa-check text-emerald-400"></i>
        <span>Nusxalandi!</span>
    </div>

    <!-- Script fayllari -->
    <script src="JavaScript/Javob.js"></script>
</body>
</html>
