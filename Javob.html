<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Javoblar - EpicMineTest</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vneshniy stil -->
    <link rel="stylesheet" href="https://raw.githubusercontent.com/Epicmine901/EpicMineTest/refs/heads/main/stil.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter & Montserrat shriftlari -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .question-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .question-card:active {
            transform: scale(0.99);
        }

        @media (min-width: 640px) {
            .question-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 16px 32px -12px rgba(15, 23, 42, 0.08);
            }
        }

        /* EPICMINETEST Glitch 3D Effect */
        .glitch-logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            color: #0f172a;
            text-shadow: 
                -1.5px -1.5px 0px #ff0055, 
                 1.5px  1.5px 0px #00e5ff;
            transition: all 0.2s ease;
        }

        .glitch-logo:hover {
            text-shadow: 
                -2.5px -2.5px 0px #ff0055, 
                 2.5px  2.5px 0px #00e5ff;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, 20px) scale(0.95); }
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
        .toast-show {
            animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <div>
        <header class="sticky top-0 z-50 glass-header border-b border-slate-200/80 shadow-sm">
            <div class="max-w-4xl mx-auto px-4 py-3 sm:py-4 flex items-center justify-between gap-3">
                
                <!-- Logo & Title -->
                <div class="flex items-center space-x-3 min-w-0">
                    <a href="index.html" class="flex-shrink-0 flex items-center justify-center w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-slate-900 text-white shadow-md shadow-slate-900/20 active:scale-95 transition">
                        <i class="fa-solid fa-layer-group text-lg sm:text-xl"></i>
                    </a>
                    <div class="min-w-0">
                        <a href="index.html" class="glitch-logo text-base sm:text-xl leading-none block truncate">
                            EPICMINETEST
                        </a>
                        <p id="subjectTitle" class="text-xs font-semibold text-blue-600 truncate pt-0.5">Yuklanmoqda...</p>
                    </div>
                </div>

                <!-- Total Count Badge -->
                <div class="flex-shrink-0 flex items-center space-x-2 bg-slate-100/90 px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-2xl text-xs font-semibold text-slate-700 border border-slate-200/80 shadow-sm">
                    <span class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="hidden xs:inline">Jami:</span>
                    <strong id="total-count" class="text-slate-900 font-bold">0</strong>
                </div>

            </div>
        </header>

        <main class="max-w-4xl mx-auto px-3.5 py-4 sm:px-6 sm:py-8">
            
            <!-- Controls Toolbar -->
            <div class="mb-5 sm:mb-8 space-y-3">
                <div class="flex flex-row gap-2 sm:gap-3">
                    
                    <!-- Search Input -->
                    <div class="relative flex-grow">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input 
                            type="text" 
                            id="search-input" 
                            placeholder="Savol yoki javobdan izlash..." 
                            class="w-full pl-10 pr-9 py-2.5 sm:py-3.5 bg-white border border-slate-200/90 rounded-2xl text-xs sm:text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition shadow-sm"
                        >
                        <button id="clear-search" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                            <i class="fa-solid fa-xmark text-sm"></i>
                        </button>
                    </div>

                    <!-- View Toggle Buttons -->
                    <div class="flex bg-white border border-slate-200/90 rounded-2xl p-1 shadow-sm shrink-0">
                        <button id="view-card" class="px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs font-bold text-blue-600 bg-blue-50 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-border-all"></i>
                            <span class="hidden sm:inline">Kartochka</span>
                        </button>
                        <button id="view-compact" class="px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs font-medium text-slate-500 hover:text-slate-800 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-list-ul"></i>
                            <span class="hidden sm:inline">Ixcham</span>
                        </button>
                    </div>

                </div>

                <div id="search-status" class="hidden text-xs font-medium text-slate-500 px-1 flex justify-between items-center">
                    <span>Qidiruv bo'yicha topildi: <strong id="visible-count" class="text-blue-600 font-bold">0</strong> ta savol</span>
                </div>
            </div>

            <!-- Dynamic Questions Container -->
            <div id="questions-container" class="space-y-3 sm:space-y-4">
                <!-- Questions injected dynamically -->
            </div>

            <!-- Empty state -->
            <div id="no-results" class="hidden text-center py-12 px-4 bg-white/80 backdrop-blur rounded-3xl border border-slate-200/80 shadow-sm mt-4">
                <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-500 flex items-center justify-center mx-auto mb-3 text-lg border border-blue-100">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <h4 class="text-sm sm:text-base font-bold text-slate-800 mb-1">Hech narsa topilmadi</h4>
                <p class="text-xs text-slate-500">Iltimos, boshqacha kalit so'z kiritib ko'ring.</p>
            </div>

        </main>
    </div>

    <footer class="mt-auto py-5 border-t border-slate-200/80 bg-white/50 backdrop-blur">
        <div class="max-w-4xl mx-auto px-4 text-center text-xs text-slate-400 font-medium">
            &copy; <a href="index.html" class="font-bold text-slate-600 hover:text-blue-600 transition">EpicMineTest</a>. Barcha huquqlar himoyalangan.
        </div>
    </footer>

    <!-- Mobile Toast Notification -->
    <div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur text-white text-xs font-semibold px-4 py-2.5 rounded-2xl shadow-xl z-50 flex items-center gap-2 border border-slate-800">
        <div class="w-4 h-4 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-[10px]">
            <i class="fa-solid fa-check"></i>
        </div>
        <span>Nusxalandi!</span>
    </div>

    <!-- Scriptingiz read.js -->
    <script src="js/read.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentFanId = parseInt(urlParams.get('FanId'), 10);
        if (isNaN(currentFanId)) currentFanId = 1;

        let testQuestions = [];

        async function fetchTestData(fanId) {
            if (typeof readJson === 'function') {
                return await readJson(fanId);
            }
            const res = await fetch(`https://raw.githubusercontent.com/Epicmine901/EpicMineTest/refs/heads/main/jsons/${fanId}.json`);
            return await res.json();
        }

        async function initMenu() {
            try {
                const fullJson = await fetchTestData(currentFanId);
                if (fullJson) {
                    document.getElementById('subjectTitle').innerText = fullJson.Fan || "Testlar";
                    testQuestions = fullJson.test_savollari || [];
                    document.getElementById('total-count').innerText = testQuestions.length;
                    
                    renderQuestions(testQuestions);
                }
            } catch (err) {
                console.error("Xatolik yuz berdi:", err);
                document.getElementById('subjectTitle').innerText = "Ma'lumot topilmadi";
            }
        }

        function renderQuestions(items) {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            items.forEach((item, index) => {
                const num = index + 1;
                const savolText = item.savol || item.vopros || '';
                
                const togriKey = item.togri_javob !== undefined ? item.togri_javob : '';
                let togriText = '';

                if (item.variantlar) {
                    if (Array.isArray(item.variantlar)) {
                        togriText = item.variantlar[togriKey] || '';
                    } else if (typeof item.variantlar === 'object') {
                        togriText = item.variantlar[togriKey] || '';
                    }
                }

                const searchKeywords = `${savolText} ${togriKey} ${togriText}`.toLowerCase();

                const cardHtml = `
                    <div class="question-card bg-white border border-slate-200/80 rounded-2xl p-4 sm:p-6 shadow-sm relative" data-keywords="${searchKeywords}">
                        <div class="flex items-center justify-between gap-2 mb-2.5">
                            <div class="flex items-center gap-2">
                                <span class="w-6 h-6 sm:w-7 sm:h-7 rounded-lg bg-blue-50 border border-blue-200/60 text-blue-600 text-xs font-bold flex items-center justify-center shrink-0">${num}</span>
                                <span class="text-[10px] sm:text-[11px] font-bold text-slate-400 uppercase tracking-wider">SAVOL</span>
                            </div>
                            <button onclick="copyQuestion(${index})" class="text-slate-400 active:text-blue-600 hover:text-blue-600 active:bg-blue-50 p-1.5 sm:p-2 rounded-xl text-xs flex items-center gap-1 transition" title="Nusxalash">
                                <i class="fa-regular fa-copy text-sm"></i>
                                <span class="text-[11px] font-semibold hidden sm:inline">Nusxalash</span>
                            </button>
                        </div>
                        
                        <h3 class="text-sm sm:text-lg font-semibold text-slate-800 leading-snug mb-3.5 q-title">
                            ${savolText}
                        </h3>
                        
                        <!-- Faqatgina bitta to'g'ri javob bloki -->
                        <div class="bg-gradient-to-r from-emerald-50/90 to-teal-50/60 border border-emerald-300/80 rounded-xl p-3 sm:p-4 flex items-start gap-2.5 sm:gap-3.5 text-emerald-950 shadow-sm">
                            <span class="w-6 h-6 sm:w-7 sm:h-7 rounded-lg bg-emerald-600 text-white font-bold text-xs flex items-center justify-center shrink-0 uppercase shadow-md shadow-emerald-600/20">
                                ${togriKey}
                            </span>
                            <p class="pt-0.5 text-xs sm:text-sm font-medium leading-relaxed q-answer">
                                ${togriText}
                            </p>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // Qidiruv
        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('clear-search');
        const searchStatus = document.getElementById('search-status');
        const visibleCountSpan = document.getElementById('visible-count');
        const noResults = document.getElementById('no-results');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.question-card');
            let count = 0;

            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
                searchStatus.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
                searchStatus.classList.add('hidden');
            }

            cards.forEach(card => {
                const text = card.getAttribute('data-keywords');
                if (text.includes(query)) {
                    card.classList.remove('hidden');
                    count++;
                } else {
                    card.classList.add('hidden');
                }
            });

            visibleCountSpan.textContent = count;
            noResults.classList.toggle('hidden', count > 0 || cards.length === 0);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input'));
            searchInput.focus();
        });

        // Nusxalash
        function copyQuestion(index) {
            const item = testQuestions[index];
            if (!item) return;

            const savolText = item.savol || item.vopros || '';
            const togriKey = item.togri_javob !== undefined ? item.togri_javob : '';
            let togriText = '';

            if (item.variantlar) {
                togriText = item.variantlar[togriKey] || '';
            }

            const textToCopy = `${index + 1}. ${savolText}\nJavob: ${togriKey}) ${togriText}`;

            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            showToast("Savol va javob nusxalandi!");
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.querySelector('span').textContent = message;
            toast.classList.remove('hidden');
            toast.classList.add('toast-show');

            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-show');
            }, 2000);
        }

        // Ko'rinish rejimini o'zgartirish
        const container = document.getElementById('questions-container');
        const viewCardBtn = document.getElementById('view-card');
        const viewCompactBtn = document.getElementById('view-compact');

        viewCardBtn.addEventListener('click', () => {
            container.className = "space-y-3 sm:space-y-4";
            document.querySelectorAll('.question-card').forEach(c => {
                c.classList.remove('p-3');
                c.classList.add('p-4', 'sm:p-6');
            });
            viewCardBtn.className = "px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs font-bold text-blue-600 bg-blue-50 shadow-sm transition flex items-center gap-1.5";
            viewCompactBtn.className = "px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs font-medium text-slate-500 hover:text-slate-800 transition flex items-center gap-1.5";
        });

        viewCompactBtn.addEventListener('click', () => {
            container.className = "space-y-2";
            document.querySelectorAll('.question-card').forEach(c => {
                c.classList.remove('p-4', 'sm:p-6');
                c.classList.add('p-3');
            });
            viewCompactBtn.className = "px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs font-bold text-blue-600 bg-blue-50 shadow-sm transition flex items-center gap-1.5";
            viewCardBtn.className = "px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl text-xs font-medium text-slate-500 hover:text-slate-800 transition flex items-center gap-1.5";
        });

        window.addEventListener('DOMContentLoaded', initMenu);
    </script>
</body>
</html>
