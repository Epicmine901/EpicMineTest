<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bosh Sahifa - Fanlar Ro'yxati</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="top-header">
    <a href="index.html" class="brand-logo">EpicMineTest</a>
  </div>

  <div class="main-container">
    <header class="main-header">
      <h1 class="main-title">Fanlar Akademiyasi</h1>
      <div class="search-box">
        <select id="semesterSelect" class="search-select">
          <option value="all">Barcha semestrlar</option>
          <option value="6">6-semestr</option>
          <option value="5">5-semestr</option>
          <option value="4">4-semestr</option>
          <option value="3">3-semestr</option>
          <option value="2">2-semestr</option>
          <option value="1">1-semestr</option>
        </select>

        <input type="text" id="searchInput" class="search-input" placeholder="Fanni nomini yozing..." autocomplete="off">
        <button id="searchBtn" class="search-btn">Qidirish</button>
      </div>
    </header>

    <main class="content-area">
      <div id="fanlarList" class="fanlar-grid">
        <div class="loading-text">Fanlar yuklanmoqda...</div>
      </div>
    </main>
  </div>

  <!-- Share Button & Modal -->
  <button id="open-share-modal-btn" class="share-trigger-btn" title="Ulashish">
      <i class="fa-solid fa-share-nodes"></i>
  </button>

  <div id="share-modal" class="modal-overlay">
      <div class="modal-card">
          <div class="modal-header">
              <h3 class="modal-title">
                  <i class="fa-solid fa-share-nodes highlight-icon"></i> Ulashish
              </h3>
              <button id="close-share-modal-btn" class="modal-close-btn">
                  <i class="fa-solid fa-xmark"></i>
              </button>
          </div>

          <div class="modal-options">
              <button id="share-simple-btn" class="share-option-btn">
                  <div>
                      <strong class="option-title">Oddiy ulashish</strong>
                      <span class="option-sub">Saytning asosiy havolasini nusxalash</span>
                  </div>
                  <i class="fa-solid fa-link icon-sub"></i>
              </button>

              <button id="share-answers-btn" class="share-option-btn">
                  <div>
                      <strong class="option-title">Javoblar bilan ulashish</strong>
                      <span class="option-sub">Barcha fanlar havolasini nusxalash</span>
                  </div>
                  <i class="fa-solid fa-list-check icon-green"></i>
              </button>
          </div>
      </div>
  </div>

  <div id="toast" class="toast-notification">
      <i class="fa-solid fa-check icon-green"></i>
      <span>Nusxalandi!</span>
  </div>

  <script src="JavaScript/index.js"></script>
</body>
</html>
